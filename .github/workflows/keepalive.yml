name: Supabase keepalive

# Supabase's free tier pauses a project after 7 days with no API activity,
# which would take the whole site down. Off-season traffic can't be relied on,
# so ping a page that reads the database every few days. /archive is
# force-dynamic, so each request runs a real Supabase query — keeping the
# project (and Vercel) warm. Well under the 7-day threshold.

on:
  schedule:
    - cron: "17 12 */3 * *" # every 3 days, 12:17 UTC (offset to avoid the top-of-hour rush)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the archive (triggers a Supabase read)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://www.newportfolkschedule.com/archive || echo 000)
            echo "attempt $attempt: /archive responded $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::/archive did not return 200 after 3 attempts"
          exit 1
